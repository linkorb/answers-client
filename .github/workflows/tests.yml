name: PHPUnit

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: phpunit:13.4.3
          coverage: none
      - name: Run unit tests
        run: phpunit --no-configuration --do-not-record-test-run-history tests
